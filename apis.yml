name: Marble Health
description: 'Marble Health is a virtual mental-health company providing personalized
  therapy for K-12 students, delivered through partnerships with schools and school
  districts and directly to families. Licensed therapists meet with students over
  video, typically within a few days and with no waitlists, and the service accepts
  most insurance plans including Medicaid. The platform at app.marblehealth.com handles
  referrals and intake for school counselors and parents, and Marble Health also runs
  parent workshops and professional-development training for educators. The company
  is backed by Costanoa Ventures. As of this enrichment pass Marble Health exposes
  no public API, developer portal, or machine-readable discovery surface (no
  .well-known documents and no llms.txt); it is a consumer/patient-facing healthtech
  service rather than an API provider.'
